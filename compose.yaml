services:
  portal:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8787:8080"
    volumes:
      - sqlite:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sqlite:
